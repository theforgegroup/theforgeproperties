        theme: {

    <style>
      html {
        scroll-behavior: smooth;
      }
      html, body { 
        background-color: #FFFFFF !important; 
        color: #0A0A0A;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'DM Sans', Inter, sans-serif;
      }

      /* Clean subtle scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #F5F5F5; }
      ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #C8FF00; }
      
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5); }
        50% { transform: scale(1.05); box-shadow: 0 0 0 14px rgba(37, 211, 102, 0); }
      }
      .animate-whatsapp-pulse {
        animation: pulseGlow 2.4s infinite cubic-bezier(0.4, 0, 0.6, 1);
      }
      
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up { animation: fadeInUp 0.8s ease-out forwards; }

      .article-content {
        min-height: 400px;
        outline: none;
        word-wrap: break-word;
        overflow-wrap: break-word;
      }
      
      .article-content iframe, 
      .article-content video {
        width: 100% !important;
        aspect-ratio: 16 / 9;
        height: auto !important;
        border-radius: 4px;
        margin: 2rem 0;
        display: block;
      }

      .article-content img {
        max-width: 100% !important;
        height: auto !important;
        display: block;
        margin: 2rem auto;
        border-radius: 2px;
      }

      .article-content h1 { font-size: 2.25rem; font-weight: 800; margin-bottom: 1.5rem; color: #0F172A; font-family: Georgia, serif; line-height: 1.2; }
      .article-content h2 { font-size: 1.875rem; font-weight: 700; margin-top: 2.5rem; margin-bottom: 1rem; color: #0F172A; font-family: Georgia, serif; line-height: 1.3; }
      .article-content p { margin-bottom: 1.5rem; line-height: 1.8; font-size: 1.125rem; color: #334155; }
      .article-content ul { list-style-type: disc !important; margin-left: 2rem !important; margin-bottom: 1.5rem !important; padding-left: 0.5rem !important; display: block !important; }
      .article-content ol { list-style-type: decimal !important; margin-left: 2rem !important; margin-bottom: 1.5rem !important; padding-left: 0.5rem !important; display: block !important; }
      .article-content li { display: list-item !important; margin-bottom: 0.5rem !important; line-height: 1.8 !important; font-size: 1.125rem !important; color: #334155 !important; }
      .article-content blockquote { border-left: 4px solid #C8FF00 !important; padding-left: 1.5rem !important; margin-left: 0 !important; margin-right: 0 !important; margin-top: 1.5rem !important; margin-bottom: 1.5rem !important; font-style: italic !important; color: #475569 !important; }
